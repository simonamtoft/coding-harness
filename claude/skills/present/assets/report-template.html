ncept-diff{font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;background:#101827;color:#c9d5e5;border-radius:11px;padding:16px;overflow:auto;white-space:pre}.concept-diff .add{color:#84e1ad}.concept-diff .remove{color:#f29a9f}.concept-diff .dim{color:#6f8198}.section>:where(.grid,.card,.visual-example,.feature-split)+:where(.grid,.card,.visual-example,.feature-split){margin-top:18px}@media(max-width:1050px){.span-3{grid-column:span 6}.span-4,.span-5,.span-7,.span-8,.span-9{grid-column:span 12}.feature-split{grid-template-columns:1fr}.feature-split>.supporting-visual{position:static}}@media(max-width:760px){.rail{position:sticky;top:0;width:100%;height:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}.brand,.report-id,.rail-foot{display:none}.rail nav{display:flex;overflow-x:auto}.rail a{white-space:nowrap;padding:9px}.main{margin-left:0;padding:24px 14px 70px;width:100%;max-width:100%;overflow:hidden}.hero,.section,.card,.visual-example{min-width:0;max-width:100%}.hero{display:block;padding-top:25px}.hero p{margin-top:20px;max-width:100%}.section-head{display:block}.section-head>p{margin-top:8px}.span-3,.span-6{grid-column:span 12}.section{scroll-margin-top:58px}.diagram-head{display:block}.legend{margin-top:10px}.data-table{display:block;max-width:100%;overflow-x:auto}.visual-example{max-width:100%}.terminal{font-size:11px}}@media print{.rail{position:static;width:auto;border:0}.rail nav,.rail-foot{display:none}.main{margin:0;padding:20px}.section,.card,.visual-example{break-inside:avoid}.card,.visual-example{box-shadow:none}}
</style>
</head>
<body>
<aside class="rail" aria-label="Report index">
  <div class="brand">Present<i>·</i></div>
  <div class="report-id"><small>Final report</small><strong>{{REPORT_TITLE}}</strong><span>{{REPORT_SUBTITLE}}</span></div>
  <nav>{{NAV_LINKS}}</nav>
  <div class="rail-foot">{{REPORT_FOOTER}}</div>
</aside>
<main class="main">
  {{REPORT_SECTIONS}}
</main>
<script>
const links=[...document.querySelectorAll('.rail nav a')];
const sections=links.map(a=>document.querySelector(a.hash)).filter(Boolean);
const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(!visible)return;links.forEach(a=>a.classList.toggle('active',a.hash==='#'+visible.target.id))},{rootMargin:'-20% 0px -60% 0px',threshold:[0,.15,.4]});
sections.forEach(section=>observer.observe(section));
</script>
</body>
</html>
