<section class="section" id="{{SECTION_ID}}">

    <div><span class="section-label">{{SECTION_LABEL}}</span><h2>{{SECTION_TITLE}}</h2></div>
    <p>{{SECTION_CONTEXT}}</p>
  </div>
  <div class="grid">
    <div class="card span-8">
      <h3>{{FINDING_TITLE}}</h3>
      <p>{{FINDING_EXPLANATION}}</p>
    </div>
    <div class="card span-4 callout">
      <span class="card-label">{{EVIDENCE_LABEL}}</span>
      <h3>{{EVIDENCE_TITLE}}</h3>
      <p>{{EVIDENCE_SUMMARY}}</p>
    </div>
  </div>
</section>
