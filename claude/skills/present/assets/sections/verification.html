<section class="section" id="verification">
  <div class="section-head">
    <div><span class="section-label">Verification</span><h2>{{VERIFICATION_TITLE}}</h2></div>
    <p>{{VERIFICATION_SCOPE}}</p>
  </div>
  <div class="grid">
    <div class="card span-4">
      <span class="card-label">Commands</span>
      <div class="metric">{{COMMANDS_PASSED}} / {{COMMANDS_RUN}}</div>
      <p class="metric-sub">{{COMMANDS_SUMMARY}}</p>
    </div>
    <div class="card span-4">
      <span class="card-label">Tests</span>
      <div class="metric">{{TESTS_FAILED}}</div>
      <p class="metric-sub">{{TESTS_SUMMARY}}</p>
    </div>
    <div class="card span-4">
      <span class="card-label">Integrity probes</span>
      <div class="metric">{{PROBE_VIOLATIONS}}</div>
      <p class="metric-sub">{{PROBE_SUMMARY}}</p>
    </div>
  </div>
</section>
