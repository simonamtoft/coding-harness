<section class="section" id="verification">
  <div class="section-head">
    <div><span class="section-label">Verification</span><h2>{{VERIFICATION_TITLE}}</h2></div>
    <p>{{VERIFICATION_SCOPE}}</p>
  </div>
  <div class="card">
    <div class="status-list">
      <div class="status"><i style="{{CHECK_ONE_INDICATOR_STYLE}}">{{CHECK_ONE_INDICATOR}}</i><div><strong>{{CHECK_ONE_NAME}}</strong><small>{{CHECK_ONE_SUMMARY}}</small></div></div>
      <div class="status"><i style="{{CHECK_TWO_INDICATOR_STYLE}}">{{CHECK_TWO_INDICATOR}}</i><div><strong>{{CHECK_TWO_NAME}}</strong><small>{{CHECK_TWO_SUMMARY}}</small></div></div>
      <div class="status"><i style="{{CHECK_THREE_INDICATOR_STYLE}}">{{CHECK_THREE_INDICATOR}}</i><div><strong>{{CHECK_THREE_NAME}}</strong><small>{{CHECK_THREE_SUMMARY}}</small></div></div>
    </div>
  </div>
</section>
