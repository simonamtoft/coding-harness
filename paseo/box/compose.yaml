# Started by paseo-box.sh, which sets the variables below. See README.md.
name: paseo-box
services:
  paseo-box:
    build: .
    image: paseo-box:local
    container_name: paseo-box
    cap_add: [NET_ADMIN, NET_RAW]  # for the firewall, applied by root before agents start
    ports:
      # 6767 is the host Paseo daemon's port.
      - "127.0.0.1:${PASEO_BOX_PORT:-6768}:6767"
    environment:
      PASEO_PASSWORD: ${PASEO_BOX_PASSWORD:?run paseo-box.sh}
      # The shared Paseo config enables the relay for the host daemon; the box is reached directly.
      PASEO_RELAY_ENABLED: "false"
      PASEO_BOX_EXTRA_HOSTS: ${PASEO_BOX_EXTRA_HOSTS:-}
      # Read by models.json provider entries; empty when unset on the Mac.
      IM_GPT_API_KEY: ${IM_GPT_API_KEY:-}
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}
    volumes:
      # Pi sign-in, Pi sessions and Paseo state; the rest of the home directory resets on every start.
      - paseo-box-state:/var/lib/paseo-box
      # The Pi setup, read-only so agents cannot change their own controls.
      - ${PASEO_BOX_HARNESS:?run paseo-box.sh}:/home/paseo/coding-harness:ro
      # Local plugin checkouts that settings.json loads by relative path.
      - ${HOME}/pi-plugins:/home/paseo/pi-plugins:ro
      # Copies of the Mac's models.json and settings.json, refreshed by paseo-box.sh.
      - ${PASEO_BOX_HOST_PI:?run paseo-box.sh}:/home/paseo/.config/paseo-box-host:ro
      # The checkout being worked on, on its current branch.
      - ${PASEO_BOX_WORKSPACE:?run paseo-box.sh}:/workspace
      # Git on the Mac executes what .git says (hooks, core.fsmonitor, commondir redirects), so the
      # box gets the whole directory read-only; commits and branches happen on the Mac.
      - ${PASEO_BOX_WORKSPACE}/.git:/workspace/.git:ro

volumes:
  paseo-box-state:
